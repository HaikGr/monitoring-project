apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-postgres-exporter

  namespaceSelector:
    matchNames:
      - monitoring

  endpoints:
    - port: http
      path: /metrics
      interval: 30s