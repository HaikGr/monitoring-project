apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-2
  namespace: temp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app-2
  template:
    metadata:
      labels:
        app: my-app-2
    spec:
      containers:
        - name: my-app-2
          image: nginx:latest
          ports:
            - containerPort: 8080